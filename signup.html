<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="Description"
      content="Love running. Club for runners in Dublin, Ireland. Urban running, trail running. Dublin docklands and pheonix park"
    />
    <meta
      name="Keywords"
      content="love running, run, running club, runners, Ireland, Dublin, port, exercise"
    />
    <title>Love Running</title>
    <!--Favicon-->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="assets/favicon/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="assets/favicon/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="assets/favicon/favicon-16x16.png"
    />
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>

  <body>
    <!--header is for the title, nav bar-->
    <header>
      <a href="index.html">
        <h1 id="logo">Love Running</h1>
      </a>

      <input type="checkbox" id="nav-toggle" name="nav-toggle>" />
      <label for="nav-toggle" class="nav-toggle-label">
        <i class="fa-solid fa-bars"></i>
      </label>

      <nav>
        <ul id="menu">
          <li><a href="index.html" >Home</a></li>
          <li><a href="gallery.html">Gallery</a></li>
          <li><a href="signup.html" class="active">Sign Up</a></li>
        </ul>
      </nav>
    </header>

    <!--main is for the bulk of the webpage-->
    <main>

      <section id="signup">
        <form id="signup-form" method="POST" action="https://formdump.codeinstitute.net">
          <h2><i class="fa-solid fa-heart-pulse"></i>Let's get you set up!</h2>
            <label for="first-name">First Name</label>
            <input type="text" id="first-name" class="text-input" required>
            <br>
            <label for="last-name">Last Name</label>
            <input type="text" id="last-name" class="text-input" required>
            <br>
            <label for="email">Email Address</label>
            <input type="text" id="email" class="text-input" required>
            <br>

            <div class="radio-buttons">
              <label for="road">Road</label>
              <input type="radio" id="road" name="running-preference" required checked>
            </div>
            <div class="radio-buttons">
              <label for="trail">Trail</label>
              <input type="radio" id="trail" name="running-preference">
            </div>
            <div class="radio-buttons">
              <label for="both">Both</label>
              <input type="radio" id="both" name="running-preference">
            </div>
            
            <input type="submit" class="join-button" value="Let's Run!">
          </form>
      </section>

    </main>

    <!--footer used for extra-->
    <footer>
      <ul id="social-networks">
        <li>
          <a
            href="https://www.facebook.com/"
            target="_blank"
            rel="noopener"
            aria-label="Visit our Facebook page (opens in a new tab)">
            <i class="fa-brands fa-facebook"></i></a>
        </li>
        <li>
          <a
            href="https://x.com/"
            target="_blank"
            rel="noopener"
            aria-label="Visit our Twitter page (opens in a new tab)">
            <i class="fa-brands fa-square-twitter"></i></a>
        </li>
        <li>
          <a
            href="https://www.youtube.com/"
            target="_blank"
            rel="noopener"
            aria-label="Visit our Youtube page (opens in a new tab)">
            <i class="fa-brands fa-square-youtube"></i></a>
        </li>
        <li>
          <a
            href="https://www.instagram.com/?hl=en"
            target="_blank"
            rel="noopener"
            aria-label="Visit our Instagram page (opens in a new tab)">
            <i class="fa-brands fa-square-instagram"></i></a>
        </li>
      </ul>
    </footer>

    <!--Font Awesome kit-->
    <script
      src="https://kit.fontawesome.com/95c9a097f5.js"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
